<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資産形成コース総復習クイズ（第1部〜第7部）</title>
<style>
  :root{
    --bg:#f7f5f2;
    --card:#ffffff;
    --ink:#2b2b2b;
    --sub:#6b6b6b;
    --accent:#a33;
    --accent-soft:#f1e2e2;
    --good:#2e7d32;
    --good-soft:#e8f5e9;
    --bad:#c62828;
    --bad-soft:#fdecea;
    --line:#e5e0da;
    --tab-inactive:#efece7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
  }
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px;}
  h1{font-size:1.35rem;margin:4px 0 4px;text-align:center;}
  .subtitle{text-align:center;color:var(--sub);font-size:0.85rem;margin-bottom:20px;}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:20px;}
  .tab{
    padding:7px 12px;
    border-radius:20px;
    background:var(--tab-inactive);
    color:var(--sub);
    font-size:0.82rem;
    cursor:pointer;
    border:1px solid transparent;
    white-space:nowrap;
    transition:all .15s;
  }
  .tab.active{background:var(--accent);color:#fff;font-weight:bold;}
  .tab .cnt{opacity:.75;font-size:0.75em;margin-left:2px;}

  .panel{display:none;}
  .panel.active{display:block;}

  .intro-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px;
    text-align:center;
  }
  .intro-card h2{margin-top:0;font-size:1.1rem;}
  .intro-card p{color:var(--sub);font-size:0.9rem;}
  .start-btn{
    margin-top:12px;
    padding:12px 28px;
    border:none;
    border-radius:24px;
    background:var(--accent);
    color:#fff;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
  }
  .start-btn:active{transform:scale(.98);}
  .opts-row{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .opt-toggle{
    padding:6px 14px;
    border-radius:16px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.8rem;
    color:var(--sub);
    cursor:pointer;
  }
  .opt-toggle.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:bold;}

  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:0.82rem;color:var(--sub);}
  .progress-bar{background:#e9e4dd;border-radius:6px;height:6px;overflow:hidden;margin-bottom:18px;}
  .progress-fill{background:var(--accent);height:100%;width:0%;transition:width .25s;}

  .qcard{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
  }
  .qtag{
    display:inline-block;
    font-size:0.72rem;
    color:var(--accent);
    background:var(--accent-soft);
    padding:2px 9px;
    border-radius:10px;
    margin-bottom:10px;
    font-weight:bold;
  }
  .qprompt{font-size:1.02rem;font-weight:bold;margin-bottom:16px;white-space:pre-wrap;}

  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 14px;
    margin-bottom:10px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:0.92rem;
    cursor:pointer;
    transition:all .12s;
    color:var(--ink);
  }
  .option:hover:not(.disabled){border-color:var(--accent);}
  .option.correct{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:bold;}
  .option.incorrect{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:bold;}
  .option.disabled{cursor:default;}
  .option .lab{display:inline-block;width:1.4em;font-weight:bold;}

  .feedback{
    margin-top:6px;
    padding:14px 16px;
    border-radius:10px;
    background:#f4f1ec;
    font-size:0.88rem;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback .verdict{font-weight:bold;margin-bottom:6px;}
  .feedback .verdict.good{color:var(--good);}
  .feedback .verdict.bad{color:var(--bad);}

  .nav-row{display:flex;justify-content:space-between;margin-top:18px;gap:10px;}
  .nav-btn{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:0.92rem;
    font-weight:bold;
    cursor:pointer;
  }
  .nav-btn.primary{background:var(--accent);color:#fff;}
  .nav-btn.primary:disabled{background:#ddd6cd;color:#999;cursor:not-allowed;}
  .nav-btn.ghost{background:#efece7;color:var(--sub);}

  .result-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:28px 22px;
    text-align:center;
  }
  .result-score{font-size:2.4rem;font-weight:bold;color:var(--accent);margin:6px 0;}
  .result-sub{color:var(--sub);font-size:0.9rem;margin-bottom:18px;}
  .result-list{text-align:left;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;}
  .result-item{
    display:flex;
    gap:8px;
    align-items:flex-start;
    padding:8px 0;
    border-bottom:1px dashed var(--line);
    font-size:0.85rem;
  }
  .result-item:last-child{border-bottom:none;}
  .mark{font-weight:bold;flex-shrink:0;}
  .mark.ok{color:var(--good);}
  .mark.ng{color:var(--bad);}
  .retry-row{display:flex;gap:10px;margin-top:20px;}
  .retry-row .nav-btn{flex:1;}

  footer{text-align:center;color:#bbb;font-size:0.72rem;margin-top:30px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>資産形成コース総復習クイズ</h1>
  <div class="subtitle">りよさん総復習会　第1部〜第7部（全73問）</div>

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <footer>社内学習用・部外秘資料の内容を含みます。外部共有はご遠慮ください。</footer>
</div>

<script>
const PARTS = [
{
  key:"p1", title:"第1部：投資と「脳」の基本",
  questions:[
    {q:"投資の本来の目的は何でしょうか？",
     opts:["短期間で一気にお金を2倍に増やすこと","長期で着実に資産を育てていくこと","毎日ハラハラしながら株価の波に乗ること"],
     correct:1,
     ex:"私たちの投資の目的は、一攫千金やギャンブルではなく、「長期でじっくりと資産を育てていくこと」です。"},
    {q:"日本人に多い「農耕民族脳（貯蓄脳）」は、コツコツ育てるのが得意な反面、投資に対してどんな傾向を持ちやすいでしょうか？",
     opts:["リスクを好んで積極的に取りにいく","リスクを恐れてコンフォート・ゾーン（安心できる範囲）から出られない","一攫千金を狙って大勝負に出る"],
     correct:1,
     ex:"日本人はコツコツ種をまいて確実に収穫する「農耕民族脳（貯蓄脳）」を持つため、ブレ（リスク）を嫌い、安心できる範囲（コンフォート・ゾーン）の外にある投資を怖がって一歩を踏み出せない傾向があります。"},
    {q:"「消費脳」と「投資脳」の違いについて、お金を払う時にフォーカスしている「意識（期間）」の違いは何でしょうか？",
     opts:["消費脳は「長期的」、投資脳は「短期的」","消費脳は「短期的（今の快楽）」、投資脳は「長期的（未来の価値）」","どちらも今すぐ満たされることを重視している"],
     correct:1,
     ex:"消費脳は「今すぐ満たされる短期的な欲求」にお金を払いますが、投資脳は「未来に価値が上がる長期的なベネフィット」にお金を投じます。"},
    {q:"投資で大きな損失を出したり、他人の失敗談を聞いて「投資＝怖いもの」と強く記憶してしまう脳の現象を何と呼びますか？",

    {q:"恐怖や不安を感じた時に活性化する脳の部位（①）と、その隣にあって記憶を司る部位（②）の正しい組み合わせはどれでしょうか？",
     opts:["①扁桃体（へんとうたい）／②海馬（かいば）","①前頭前野／②扁桃体","①海馬／②前頭前野"],
     correct:0,
     ex:"恐怖や不安などの感情は「扁桃体」が感じ、その隣にある記憶を司る「海馬」に作用して長期記憶として残ります。"},
    {q:"自分にとって価値がある・重要だと思った情報だけを脳に届ける（例：投資に関心を持つと新聞の金融情報が自然と目に入るようになる）脳のフィルター機能を何と呼びますか？",
     opts:["CNS","RAS（網様体賦活系）","BS/PL"],
     correct:1,

    {q:"富を形成するために最も土台となる「3つの心」とは何でしょうか？",

    {q:"「3つの心」のうち、「大義（利己を超えた目的）」を持つことが、資産形成においてなぜ重要なのでしょうか？",

    {q:"毎月の収入が入った時、一番最初に「自分の投資口座や貯蓄（BAS口座）」にお金を支払う行動は、精神面において何を意味していますか？",
     opts:["自分を一番後回しにしている","自分を一番に尊重し、愛していることの現れ","単なる義務的な事務作業"],
     correct:1,
     ex:"収入が入って真っ先に自分自身の未来（BAS口座・貯蓄・投資）に支払うことは、「自分を一番大切に扱っている」という愛の証明になり、自己肯定感を高めます。"}
  ]
},
{
  key:"p2", title:"第2部：リスクとリスク許容度",

    {q:"期待リターンが「5%」、リスク（1標準偏差）が「10%」のファンドに投資した場合、約68%の確率で毎年のリターンはどの範囲に収まりますか？",

     ex:"「高いリスクを取れば必ず儲かる」というのは誤解です。ブレ幅が大きい（ハイリスク）ということは、下に大きくブレて低リスクの商品よりも成績が悪くなる可能性も含んでいます。"},
    {q:"40階建てのビルの屋上からカゴに向かってボールを投げる時、風の影響などで外れる面積（ブレ幅）が大きくなることを、投資では何の言葉で表現しますか？",

     correct:1,
     ex:"下落した時にパニックにならず、心穏やかに過ごせるマイナスの許容範囲を「リスク許容度」と呼びます。"},
    {q:"リスク許容度を決定する「主な5つの要素」に含まれないものはどれでしょうか？",

{

    {q:"【グロースとバリューの負の相関関係】景気サイクルや市場局面において、バリューファンドとグロースファンドの値動きに認められる「負の相関関係」を踏まえたときに取るアプローチはどれですか？",

    {q:"【時価総額の算出とサイズ区分】株式投資において、企業の規模（サイズ）を客観的に示す「時価総額」の計算式として、正しいものはどれですか？",

    {q:"【Russell/Nomuraインデックスの定義】日本株式市場全体をカバーする代表的な指数「Russell/Nomura Total Marketインデックス（時価総額上位98%）」における、大型株（Large Cap）および小型株（Small Cap）のカバー率（定義）について、正しい組み合わせはどれですか？",

{

    {q:"【ポートフォリオのリスク決定因子】モダンポートフォリオ理論（MPT）において、ポートフォリオ「全体」のリスク（ブレ幅・標準偏差）は、単純な加重平均では決まりません。リスクを大きく低下させるための最も重要な決定要因は何ですか？",

    {q:"【分散投資の6つの次元】リスクを徹底的に低減するための「分散投資の6つのやり方（視点）」の中で、セクター（業種）分散とテーマ分散の決定的な違いとして、正しい記述はどれですか？",

    {q:"【ドルコスト平均法と平均単価の数理】毎月「同じ日に」「同じ金額（定額）」を買い付ける「ドルコスト平均法（時間の分散）」において、なぜ自動的に「平均購入単価」を市場の平均価格より引き下げることができるのですか？その数理的なメカニズムを説明してください。",
     opts:["証券会社が毎月定額で買う顧客に対してだけ、裏側で特別に20%値引きした価格を適用しているため","「高い価格のときは購入株（口）数が少なくなり」、「安い（下落した）価格のときは購入株（口）数が自動的に多くなる」ため、長期間累積したときの加重平均コスト（1株当たりの仕入れ値）が、単純に市場の平均価格を上回る時期を自動的に下回る（安く仕込める）数理になるから","毎月同じ日に購入することで、株式市場がその日だけ一斉に株価を引き下げるという奇跡が起きるから"],

    {q:"【期待リターンとリスク許容度の決定手順】合理的なポートフォリオを構築するにあたり、最も間違えやすいのが「期待リターンから逆算して資産配分（ポートフォリオ）を決めること」です。正しい意思決定の手順はどれですか？",
     opts:["1. 得たい期待リターンをまず決め、2. そのリターンを達成するために必要なレバレッジを限界までかけ、3. リスクや自分の感覚（感情）は無視して全力投資する","1. 自分の感情（下げ幅に耐えられるか）から「リスク許容度（許容できる下げ幅）」を判定し、2. 決定したリスク許容度の範囲内で「取れるリスク（標準偏差）」を決定し、3. そのリスク内で得られる「最大の期待リターン」をもたらすアセット・アロケーションを決定する","期待リターンやリスクは計算が難しいため一切考えず、とりあえず今週ネットで一番話題になっている流行の銘柄を全力で買う"],

    {q:"【リバランスの定量トリガーと心理的効果】時間の経過によってポートフォリオの保有比率が「当初設定したアセット・アロケーション（目標）」から乖離した際に行う「リバランス（再調整）」について、その定量的な実行基準（ルール）と、投資家にもたらされる心理的・規律的効果として、正しい記述はどれですか？",
     opts:["基準は「市場が最高値を更新した日」、効果は「毎日パソコンの画面に張り付いて、秒単位で売買を繰り返すスリル（ギャンブル欲）を満足させる」こと","基準は「目標比率から何%以上乖離したか（乖離トリガー）」または「何ヶ月・1年に1回行うか（期間トリガー）」のいずれかで事前に決めて実施。効果は、値上がりして比率が増えた資産を「高いところで利益確定し」、値下がりして減った資産を「安いところで自動的に買い増す（高売り安買いの規律が感情を排除して機能する）」こと","基準は「自分が今週お金が足りないと感じた時」、効果は「利益が出ている資産をすべて売却して高級車を買い、残った損失資産だけを永遠に放置する」こと"],

// ---------- state ----------
let state = {}; // key -> {order:[idx...], pos:0, answered:[], correctCount:0}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function initPartState(part, randomize){
  const order = randomize ? shuffle([...Array(part.questions.length).keys()]) : [...Array(part.questions.length).keys()];
  state[part.key] = {order, pos:0, answered:new Array(part.questions.length).fill(null), correctCount:0, finished:false};
}

// ---------- render tabs ----------
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

PARTS.forEach((part, i)=>{
  const tab = document.createElement('div');
  tab.className = 'tab' + (i===0?' active':'');
  tab.dataset.key = part.key;
  tab.innerHTML = part.title.replace(/：.*/,'') + `<span class="cnt">(${part.questions.length})</span>`;
  tab.onclick = ()=> switchTab(part.key);
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0?' active':'');
  panel.id = 'panel-'+part.key;
  panelsEl.appendChild(panel);

  renderIntro(part);
});

function switchTab(key){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.key===key));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+key));
}

function renderIntro(part){
  const panel = document.getElementById('panel-'+part.key);
  panel.innerHTML = `
    <div class="intro-card">
      <h2>${part.title}</h2>
      <p>全${part.questions.length}問。何度でも繰り返し挑戦できます。</p>
      <div class="opts-row">
        <div class="opt-toggle" id="rand-${part.key}">🔀 順不同で出題</div>
      </div>
      <button class="start-btn" id="start-${part.key}">クイズを始める</button>
    </div>
  `;
  let randomize = false;
  const randToggle = document.getElementById('rand-'+part.key);
  randToggle.onclick = ()=>{
    randomize = !randomize;
    randToggle.classList.toggle('on', randomize);
  };
  document.getElementById('start-'+part.key).onclick = ()=>{
    initPartState(part, randomize);
    renderQuestion(part);
  };
}

function renderQuestion(part){
  const st = state[part.key];
  const panel = document.getElementById('panel-'+part.key);
  const qIdx = st.order[st.pos];
  const q = part.questions[qIdx];
  const total = part.questions.length;

  panel.innerHTML = `
    <div class="progress-row">
      <span>${part.title.split('：')[0]}</span>
      <span>${st.pos+1} / ${total}</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${(st.pos)/total*100}%"></div></div>
    <div class="qcard">
      <div class="qtag">Q${st.pos+1}</div>
      <div class="qprompt">${q.q}</div>
      <div id="opts-${part.key}"></div>
      <div class="feedback" id="fb-${part.key}"></div>
      <div class="nav-row">
        <button class="nav-btn ghost" id="quit-${part.key}">中断してパート選択に戻る</button>
        <button class="nav-btn primary" id="next-${part.key}" disabled>次の問題へ</button>
      </div>
    </div>
  `;

  const optsEl = document.getElementById('opts-'+part.key);
  const labels = ['A','B','C','D'];
  q.opts.forEach((optText, oi)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = `<span class="lab">${labels[oi]}.</span> ${optText}`;
    btn.onclick = ()=> selectOption(part, qIdx, oi);
    optsEl.appendChild(btn);
  });

  document.getElementById('quit-'+part.key).onclick = ()=> renderIntro(part);
  document.getElementById('next-'+part.key).onclick = ()=>{
    if(st.pos < total-1){
      st.pos++;
      renderQuestion(part);
    } else {
      renderResult(part);
    }
  };

  // already answered? (going back not supported, but guard)
  if(st.answered[qIdx]!==null){
    showFeedback(part, qIdx, st.answered[qIdx]);
  }
}

function selectOption(part, qIdx, chosenIdx){
  const st = state[part.key];
  if(st.answered[qIdx]!==null) return; // already answered
  const q = part.questions[qIdx];
  const isCorrect = chosenIdx === q.correct;
  st.answered[qIdx] = chosenIdx;
  if(isCorrect) st.correctCount++;
  showFeedback(part, qIdx, chosenIdx);
}

function showFeedback(part, qIdx, chosenIdx){
  const q = part.questions[qIdx];
  const optsEl = document.getElementById('opts-'+part.key);
  const buttons = optsEl.querySelectorAll('.option');
  buttons.forEach((b,i)=>{
    b.classList.add('disabled');
    b.onclick = null;
    if(i===q.correct) b.classList.add('correct');
    if(i===chosenIdx && chosenIdx!==q.correct) b.classList.add('incorrect');
  });
  const fb = document.getElementById('fb-'+part.key);
  const isCorrect = chosenIdx===q.correct;
  fb.className = 'feedback show';
  fb.innerHTML = `
    <div class="verdict ${isCorrect?'good':'bad'}">${isCorrect ? '✓ 正解です！' : '✗ 不正解'}</div>
    <div>${q.ex}</div>
  `;
  document.getElementById('next-'+part.key).disabled = false;
}

function renderResult(part){
  const st = state[part.key];
  const panel = document.getElementById('panel-'+part.key);
  const total = part.questions.length;
  const score = st.correctCount;
  const pct = Math.round(score/total*100);

  let listHtml = '';
  part.questions.forEach((q, i)=>{
    const chosen = st.answered[i];
    const ok = chosen === q.correct;
    listHtml += `
      <div class="result-item">
        <span class="mark ${ok?'ok':'ng'}">${ok?'○':'×'}</span>
        <span>${q.q}</span>
      </div>
    `;
  });

  panel.innerHTML = `
    <div class="result-card">
      <div>お疲れさまでした</div>
      <div class="result-score">${score} / ${total}</div>
      <div class="result-sub">正答率 ${pct}%</div>
      <div class="retry-row">
        <button class="nav-btn primary" id="retry-${part.key}">もう一度挑戦する</button>
        <button class="nav-btn ghost" id="back-${part.key}">パート選択に戻る</button>
      </div>
      <div class="result-list">${listHtml}</div>
    </div>
  `;
  document.getElementById('retry-'+part.key).onclick = ()=>{
    initPartState(part, false);
    renderQuestion(part);
  };
  document.getElementById('back-'+part.key).onclick = ()=> renderIntro(part);
}
</script>
</body>
</html>
